<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Berkah Samudera — layanan maritim, distribusi, dan solusi logistik pesisir yang tepercaya." />
    <title>Berkah Samudera</title>
    <style>
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --primary: #0f766e;
        --primary-dark: #115e59;
        --border: #cbd5e1;
        --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
        line-height: 1.6;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .container {
        width: min(1120px, calc(100% - 2rem));
        margin-inline: auto;
      }

      .site-header {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 50;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 72px;
        padding-block: 0.75rem;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        font-weight: 700;
        font-size: 1.125rem;
      }

      .brand-mark {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        background: var(--primary);
        color: #fff;
        font-weight: 800;
      }

      .nav {
        display: flex;
        align-items: center;
        gap: 1.25rem;
        color: var(--muted);
        font-weight: 600;
      }

      .nav a:hover,
      .nav a:focus-visible {
        color: var(--primary-dark);
      }

      .nav-toggle {
        display: none;
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: 10px;
        padding: 0.5rem 0.75rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      main {
        display: block;
        min-height: calc(100vh - 72px);
      }

      .hero {
        padding: 5rem 0 4rem;
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(255, 255, 255, 0)),
          var(--surface);
        border-bottom: 1px solid var(--border);
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.15fr 0.85fr;
        gap: 2rem;
        align-items: center;
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 1rem;
        color: var(--primary-dark);
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        font-size: 0.875rem;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.2;
      }

      h1 {
        font-size: clamp(2.25rem, 5vw, 4rem);
        margin-bottom: 1rem;
      }

      h2 {
        font-size: clamp(1.75rem, 3vw, 2.5rem);
        margin-bottom: 0.75rem;
      }

      h3 {
        font-size: 1.125rem;
        margin-bottom: 0.5rem;
      }

      p {
        margin: 0;
      }

      .lead {
        color: var(--muted);
        font-size: 1.125rem;
        max-width: 48rem;
      }

      .cta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.75rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0.75rem 1.25rem;
        border-radius: 12px;
        border: 1px solid transparent;
        font-weight: 700;
        cursor: pointer;
        transition: transform 150ms ease, opacity 150ms ease, background 150ms ease;
      }

      .btn:hover {
        opacity: 0.95;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background: var(--primary);
        color: #fff;
      }

      .btn-secondary {
        background: #fff;
        color: var(--text);
        border-color: var(--border);
      }

      .hero-card {
        background: #ecfeff;
        border: 1px solid #a5f3fc;
        border-radius: 24px;
        padding: 1.5rem;
        box-shadow: var(--shadow);
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.75rem;
        margin-top: 1.25rem;
      }

      .stat {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1rem;
      }

      .stat strong {
        display: block;
        font-size: 1.5rem;
        color: var(--primary-dark);
      }

      .stat span {
        color: var(--muted);
        font-size: 0.875rem;
      }

      section {
        padding: 4rem 0;
      }

      .section-head {
        max-width: 44rem;
        margin-bottom: 2rem;
      }

      .section-head p {
        color: var(--muted);
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1rem;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 1.25rem;
        box-shadow: var(--shadow);
      }

      .card p {
        color: var(--muted);
      }

      .contact {
        background: var(--surface);
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .contact-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: start;
      }

      .contact-list {
        list-style: none;
        margin: 1.25rem 0 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }

      .contact-list li {
        background: #f1f5f9;
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 1rem;
      }

      form {
        display: grid;
        gap: 1rem;
      }

      label {
        display: grid;
        gap: 0.375rem;
        font-weight: 700;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0.875rem;
        font: inherit;
        background: #fff;
        color: var(--text);
      }

      textarea {
        min-height: 140px;
        resize: vertical;
      }

      .status {
        min-height: 24px;
        color: var(--primary-dark);
        font-weight: 700;
      }

      .site-footer {
        background: #0f172a;
        color: #e2e8f0;
        padding: 2rem 0;
      }

      .footer-inner {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        color: #cbd5e1;
      }

      .hidden {
        display: none;
      }

      @media (max-width: 900px) {
        .hero-grid,
        .contact-grid {
          grid-template-columns: 1fr;
        }

        .cards {
          grid-template-columns: 1fr;
        }

        .stat-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 720px) {
        .nav {
          position: absolute;
          inset: 72px 1rem auto;
          flex-direction: column;
          align-items: flex-start;
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 1rem;
          box-shadow: var(--shadow);
        }

        .nav-toggle {
          display: inline-flex;
        }
      }
    </style>
  </head>

          <span>Berkah Samudera</span>
        </a>

        <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="primaryNav">
          Menu
        </button>
